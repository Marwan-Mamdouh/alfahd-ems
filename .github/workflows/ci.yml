name: CI

on:
  pull_request:
    branches: [master]

jobs:
  ci:
    name: Lint, Build, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `apps/web/.env.local` is gitignored, so a fresh checkout has no API_URL.
      # `next.config.ts` throws without it, which fails the `Build` step below
      # (and `pnpm dev` for any new contributor) unless it is set here.
      - name: Build environment configs
        run: |
          echo "API_URL=http://localhost:3000" >> apps/web/.env.local
          echo "PORT=3001" >> apps/web/.env.local
          cp apps/api/.env.example apps/api/.env

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Build types
        run: pnpm --filter @alfahd/types build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: E2E Test
        run: pnpm --filter @alfahd/api test:e2e
